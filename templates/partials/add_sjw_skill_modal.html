<dialog
  id="add-sjw-skill-modal"
  class="add-sjw-skill-overlay"
  hidden
>
  <article id="add-sjw-skill-menu" class="add-sjw-skill-content">
    <header>
      <h2 class="modal-title">Ajouter un skill SJW</h2>
      <button type="button" class="close-modal" data-close-modal aria-label="Fermer">&times;</button>
    </header>
    <form
      id="add-sjw-skill-form"
      method="POST"
      action="{{ url_for('sjw.add_sjw_skill') }}"
    >
      <nav class="edit-tabs">
        <button type="button" class="edit-tab active" data-tab="main">Infos principales</button>
      </nav>
      <section class="edit-tab-content active" id="add-sjw-skill-tab-main">
        <div class="add-form-group">
          <label>Nom :</label>
          <input type="text" name="name" required />
        </div>

        <div class="add-form-group">
          <label>Type :</label>
          <select name="type" id="add-sjw-skill-type" required>
            <option value="Skill">Skill</option>
            <option value="QTE">QTE</option>
            <option value="Ultime">Ultime</option>
          </select>
        </div>

        <div class="add-form-group">
          <label>Ordre d'affichage :</label>
          <input type="number" name="order" id="add-sjw-skill-order" min="1" required />
        </div>

        <div class="add-form-group">
          <label>Image principale :</label>
          <select name="image" id="sjw-skill-image-select"></select>
        </div>

        <div class="add-form-group">
          <label>Description :</label>
          <textarea name="description"></textarea>
        </div>

        <div id="sjw-skill-gems-container"></div>
        <button type="button" id="add-sjw-skill-gem-btn" class="admin-btn" style="margin-top:10px;">Ajouter une gem</button>

        <footer>
          <button type="submit" class="admin-btn">Enregistrer</button>
        </footer>
      </section>
    </form>
  </article>
</dialog>

<script>
(function() {
    const addSjwSkillModal = document.getElementById('add-sjw-skill-modal');
    const closeBtns = addSjwSkillModal.querySelectorAll('.close-modal, [data-close-modal]');
    const form = document.getElementById('add-sjw-skill-form');

    closeBtns.forEach(btn => btn.addEventListener('click', () => {
        addSjwSkillModal.close();
        addSjwSkillModal.setAttribute('hidden', '');
    });

    addSjwSkillModal?.addEventListener('click', (e) => {
        if (e.target === addSjwSkillModal) {
            addSjwSkillModal.close();
            addSjwSkillModal.setAttribute('hidden', '');
        }
    });

    document.getElementById('add-sjw-skill-btn')?.addEventListener('click', async function() {
        const name = prompt("Nom du skill :");
        if (!name) return;
        let type = null;
        while (!["Skill", "QTE", "Ultime"].includes(type)) {
            type = prompt("Type du skill (Skill, QTE, Ultime) :");
            if (type === null) return;
            type = type.trim();
        }
        let order = null;
        if (type === "Skill") {
            while (!/^\d{3}$/.test(order)) {
                order = prompt("Ordre d'affichage (3 chiffres, ex : 001, 010, 123) :");
                if (order === null) return;
                order = order.trim();
            }
        } else {
            while (!/^\d{2}$/.test(order)) {
                order = prompt(`Ordre d'affichage (2 chiffres, ex : 01, 02, 10) :`);
                if (order === null) return;
                order = order.trim();
            }
        }

        let folderExists = false;
        try {
            const resp = await fetch(`/SJW/add_skill/check_image_folder_skill?type=${encodeURIComponent(type)}&order=${encodeURIComponent(order)}`);
            folderExists = (await resp.json()).exists;
        } catch (e) {
            folderExists = false;
        }

        addSjwSkillModal.removeAttribute('hidden');
        addSjwSkillModal.showModal();

        form.querySelector('input[name="name"]').value = name;
        form.querySelector('select[name="type"]').value = type;
        form.querySelector('input[name="order"]').value = order;

        if (!folderExists) {
            if (confirm("Dossier d'images introuvable. Voulez-vous uploader un .zip d'images ?")) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.zip';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    const formData = new FormData();
                    formData.append('images_zip', file);
                    formData.append('type', type);
                    formData.append('order', order);
                    const resp = await fetch('/admin/upload_sjw_skill_images_zip', {
                        method: 'POST',
                        body: formData
                    });
                    const txt = await resp.text();
                    alert(txt);
                    loadImages(type, order);
                };
                input.click();
            }
        }

        loadImages(type, order);
    });

    async function loadImages(type, order) {
        const imageSelect = document.getElementById('sjw-skill-image-select');
        imageSelect.innerHTML = '<option value="">Chargement...</option>';
        try {
            const resp = await fetch(`/SJW/skill_images?type=${encodeURIComponent(type)}&order=${encodeURIComponent(order)}`);
            const images = await resp.json();
            if (images.length > 0) {
                imageSelect.innerHTML = ['<option value=""></option>'].concat(images.map(img => `<option value="${img}">${img}</option>`)).join('');
            } else {
                imageSelect.innerHTML = '<option value=""></option><option value="">Aucune image trouvée</option>';
            }
        } catch (e) {
            imageSelect.innerHTML = '<option value="">Erreur lors du chargement</option>';
        }
    }

    const gemTypes = ["Dark", "Fire", "Light", "Neutre", "Water", "Wind"];
    let gemCount = 0;
    const maxGems = 4;

    function checkGemBtnAvailability() {
        const type = form.querySelector('select[name="type"]').value;
        const addBtn = document.getElementById('add-sjw-skill-gem-btn');
        if (type === "Ultime") {
            addBtn.style.display = "none";
            document.getElementById('sjw-skill-gems-container').innerHTML = "";
            gemCount = 0;
        } else {
            addBtn.style.display = (gemCount < maxGems) ? '' : 'none';
        }
    }

    form.querySelector('select[name="type"]').addEventListener('change', checkGemBtnAvailability);

    document.getElementById('add-sjw-skill-gem-btn').onclick = function() {
        if (gemCount < maxGems) {
            addGemField(gemCount);
        }
    };

    function addGemField(order) {
        const container = document.getElementById('sjw-skill-gems-container');
        const gemDiv = document.createElement('div');
        gemDiv.className = 'edit-skill-gem-block';
        gemDiv.innerHTML = `
        <fieldset>
            <legend>Gem #${order+1}</legend>
            <div class="add-form-group">
                <label>Type :</label>
                <select name="gems[${order}][type]" required>
                    ${gemTypes.map(t => `<option value="${t}">${t}</option>`).join('')}
                </select>
            </div>
            <div class="add-form-group">
                <label>Alias :</label>
                <input type="text" name="gems[${order}][alias]" required>
            </div>
            <div class="add-form-group">
                <label>Image :</label>
                <select name="gems[${order}][image]" class="gem-image-select" required>
                    <option value="">Chargement...</option>
                </select>
            </div>
            <div class="add-form-group">
                <label>Nom :</label>
                <input type="text" name="gems[${order}][name]" required>
            </div>
            <div class="add-form-group">
                <label>Description :</label>
                <textarea name="gems[${order}][description]"></textarea>
            </div>
            <div class="checkbox-row">
                <label><input type="checkbox" name="gems[${order}][break]"> Break</label>
                <label><input type="checkbox" class="gem-buff-check"> Buff</label>
                <label><input type="checkbox" class="gem-debuff-check"> Debuff</label>
            </div>
            <div class="gem-buff-fields" style="display:none;">
                <div class="buffs-list"></div>
                <button type="button" class="add-buff-btn admin-btn">Ajouter un buff</button>
            </div>
            <div class="gem-debuff-fields" style="display:none;">
                <div class="debuffs-list"></div>
                <button type="button" class="add-debuff-btn admin-btn">Ajouter un debuff</button>
            </div>
            <button type="button" class="remove-gem-btn admin-btn">Supprimer cette gem</button>
            <input type="hidden" name="gems[${order}][order]" value="${order}">
        </fieldset>`;
        container.appendChild(gemDiv);

        const skillType = form.querySelector('select[name="type"]').value;
        const skillOrder = form.querySelector('input[name="order"]').value;
        const select = gemDiv.querySelector('.gem-image-select');

        fetch(`/SJW/skill_images?type=${encodeURIComponent(skillType)}&order=${encodeURIComponent(skillOrder)}`)
            .then(resp => resp.json())
            .then(images => {
                select.innerHTML = ['<option value=""></option>'].concat(images.map(img => `<option value="${img}">${img}</option>`)).join('');
            });

        gemDiv.querySelector('.gem-buff-check').addEventListener('change', function() {
            gemDiv.querySelector('.gem-buff-fields').style.display = this.checked ? '' : 'none';
        });
        gemDiv.querySelector('.gem-debuff-check').addEventListener('change', function() {
            gemDiv.querySelector('.gem-debuff-fields').style.display = this.checked ? '' : 'none';
        });

        gemDiv.querySelector('.add-buff-btn').onclick = function() {
            const list = gemDiv.querySelector('.buffs-list');
            const bIdx = list.children.length;
            const bDiv = document.createElement('div');
            bDiv.innerHTML = `
                <fieldset>
                    <legend>Buff #${bIdx+1}</legend>
                    <label>Nom :</label>
                    <input type="text" name="gems[${order}][buffs][${bIdx}][name]" required>
                    <label>Image :</label>
                    <select name="gems[${order}][buffs][${bIdx}][image]" class="gem-buff-image-select"></select>
                    <label>Description :</label>
                    <textarea name="gems[${order}][buffs][${bIdx}][description]"></textarea>
                    <button type="button" class="remove-item-btn">Supprimer</button>
                </fieldset>`;
            list.appendChild(bDiv);
            fetch(`/SJW/skill_images?type=${encodeURIComponent(skillType)}&order=${encodeURIComponent(skillOrder)}`)
                .then(r => r.json()).then(imgs => {
                    bDiv.querySelector('.gem-buff-image-select').innerHTML = ['<option value=""></option>'].concat(imgs.map(i => `<option value="${i}">${i}</option>`)).join('');
                });
            bDiv.querySelector('.remove-item-btn').onclick = () => bDiv.remove();
        };

        gemDiv.querySelector('.add-debuff-btn').onclick = function() {
            const list = gemDiv.querySelector('.debuffs-list');
            const dIdx = list.children.length;
            const dDiv = document.createElement('div');
            dDiv.innerHTML = `
                <fieldset>
                    <legend>Debuff #${dIdx+1}</legend>
                    <label>Nom :</label>
                    <input type="text" name="gems[${order}][debuffs][${dIdx}][name]" required>
                    <label>Image :</label>
                    <select name="gems[${order}][debuffs][${dIdx}][image]" class="gem-debuff-image-select"></select>
                    <label>Description :</label>
                    <textarea name="gems[${order}][debuffs][${dIdx}][description]"></textarea>
                    <button type="button" class="remove-item-btn">Supprimer</button>
                </fieldset>`;
            list.appendChild(dDiv);
            fetch(`/SJW/skill_images?type=${encodeURIComponent(skillType)}&order=${encodeURIComponent(skillOrder)}`)
                .then(r => r.json()).then(imgs => {
                    dDiv.querySelector('.gem-debuff-image-select').innerHTML = ['<option value=""></option>'].concat(imgs.map(i => `<option value="${i}">${i}</option>`)).join('');
                });
            dDiv.querySelector('.remove-item-btn').onclick = () => dDiv.remove();
        };

        gemDiv.querySelector('.remove-gem-btn').onclick = () => {
            gemDiv.remove();
            gemCount--;
            checkGemBtnAvailability();
        };

        gemCount++;
        checkGemBtnAvailability();
    }
})();
</script>

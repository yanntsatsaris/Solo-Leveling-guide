<dialog
  id="add-weapon-modal"
  class="add-weapon-overlay"
  hidden
>
  <article id="add-weapon-menu" class="add-weapon-content">
    <header>
      <h2 class="modal-title">Ajouter une arme</h2>
      <button type="button" class="close-modal" data-close-modal aria-label="Fermer">&times;</button>
    </header>
    <form
      id="add-weapon-form"
      method="POST"
      action="{{ url_for('sjw.add_weapon') }}"
    >
      <nav class="edit-tabs">
        <button type="button" class="edit-tab active" data-tab="main">Infos principales</button>
      </nav>
      <section class="edit-tab-content active" id="add-weapon-tab-main">
        <div class="add-form-group">
          <label>Nom :</label>
          <input type="text" name="name" required />
        </div>
        <div class="add-form-group">
          <label>Alias :</label>
          <input type="text" name="alias" required />
        </div>
        <div class="add-form-group">
          <label>Type :</label>
          <input type="text" name="type" required />
        </div>
        <div class="add-form-group">
          <label>Rareté :</label>
          <input type="text" name="rarity" required />
        </div>
        <div class="add-form-group">
          <label>Description :</label>
          <textarea name="description"></textarea>
        </div>
        <input type="hidden" name="image_folder" value="">

        <h4 class="evolutions-title">Évolutions de l'arme</h4>
        <div class="evolutions-grid">
          {% set total_evos = 7 %}
          {% for i in range(total_evos) %}
            {% if i % 2 == 0 %}
            <div class="evolutions-row">
            {% endif %}
              <div class="edit-evolution-block">
                <label>Évolution : {{ 'A' ~ i if not i == 6 else 'A6-10' }}</label>
                <textarea name="weapon_evolution_description_{{ i }}"></textarea>
                <input type="hidden" name="weapon_evolutions_{{ i }}_evolution_id"
                  value="{{ 'A' ~ i if not i == 6 else 'A6-10' }}">
                <input type="hidden" name="weapon_evolutions_id_{{ i }}" value="">
              </div>
            {% if i % 2 == 1 or i == total_evos - 1 %}
            </div>
            {% endif %}
          {% endfor %}
        </div>
        <footer>
          <button type="submit" class="add-submit-btn">Enregistrer</button>
        </footer>
      </section>
    </form>
  </article>
</dialog>

<script>
    // Gestion de la modale avec Dialog API
    const addWeaponModal = document.getElementById('add-weapon-modal');
    const closeAddWeaponBtns = addWeaponModal.querySelectorAll('.close-modal, [data-close-modal]');

    closeAddWeaponBtns.forEach(btn => btn.addEventListener('click', () => {
        addWeaponModal.close();
        addWeaponModal.setAttribute('hidden', '');
    });

    addWeaponModal?.addEventListener('click', (e) => {
        if (e.target === addWeaponModal) {
            addWeaponModal.close();
            addWeaponModal.setAttribute('hidden', '');
        }
    });

    document.getElementById('add-weapon-btn')?.addEventListener('click', async function() {
        const name = prompt("Nom de l'arme :");
        if (!name) return;
        const alias = prompt("Alias de l'arme :");
        if (!alias) return;
        const type = prompt("Type de l'arme  :");
        if (!type) return;
        const rarity = prompt("Rareté de l'arme (SSR, SR, R) :");
        if (!rarity) return;

        let folderExists = false;
        try {
            const resp = await fetch(`/SJW/add_weapon/check_image_folder_weapon?alias=${encodeURIComponent(alias)}&type=${encodeURIComponent(type)}`);
            folderExists = (await resp.json()).exists;
        } catch (e) {
            folderExists = false;
        }

        // Ouvrir le modal
        addWeaponModal.removeAttribute('hidden');
        addWeaponModal.showModal();

        // Pré-remplir
        document.querySelector('#add-weapon-form input[name="name"]').value = name;
        document.querySelector('#add-weapon-form input[name="alias"]').value = alias;
        document.querySelector('#add-weapon-form input[name="type"]').value = type;
        document.querySelector('#add-weapon-form input[name="rarity"]').value = rarity;

        if (!folderExists) {
            // Logique d'upload simplifiée pour l'exemple
            const upload = confirm("Dossier d'images introuvable. Voulez-vous uploader un .zip d'images ?");
            if (upload) {
                // Créer un input file temporaire
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.zip';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    const formData = new FormData();
                    formData.append('images_zip', file);
                    formData.append('alias', alias);
                    formData.append('type', type);
                    const resp = await fetch('/admin/upload_weapon_images_zip', {
                        method: 'POST',
                        body: formData
                    });
                    const txt = await resp.text();
                    alert(txt);
                };
                input.click();
            }
        }
    });
</script>

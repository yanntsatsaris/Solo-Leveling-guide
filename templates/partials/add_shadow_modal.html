<dialog id="add-shadow-modal" class="add-shadow-overlay">
  <article class="add-shadow-content">
    <header>
      <h2 class="edit-shadow-title">Ajouter une ombre</h2>
      <button type="button" class="close-add-shadow" aria-label="Fermer">&times;</button>
    </header>
    <form
      id="add-shadow-form"
      method="POST"
      action="{{ url_for('sjw.add_shadow') }}"
    >
      <nav class="edit-tabs">
        <button type="button" class="edit-tab active" data-tab="main">Infos principales</button>
      </nav>
      <section class="edit-tab-content active" id="edit-tab-main">
        <div class="add-form-group">
          <label>Nom :</label>
          <input type="text" name="name" required />
        </div>
        <div class="add-form-group">
          <label>Alias :</label>
          <input type="text" name="alias" required />
        </div>
        <div class="add-form-group">
          <label>Description :</label>
          <textarea name="description"></textarea>
        </div>
        <input type="hidden" name="image_folder" value="">

        <h4 class="evolutions-title">Évolutions de l'ombre</h4>
        <div class="evolutions-grid">
          {% set total_evos = 5 %}
          {% for i in range(total_evos) %}
            {% if i % 2 == 0 %}<div class="evolutions-row">{% endif %}
              <div class="edit-evolution-block">
                <label>Évolution : {{ 'A' ~ i }}</label>
                <textarea name="shadow_evolution_description_{{ i }}"></textarea>
                <input type="hidden" name="shadow_evolutions_{{ i }}_evolution_id" value="{{ 'A' ~ i }}">
                <input type="hidden" name="shadow_evolutions_id_{{ i }}" value="">
              </div>
            {% if i % 2 == 1 or i == total_evos - 1 %}</div>{% endif %}
          {% endfor %}
        </div>
      </section>
      <footer>
        <button type="submit" class="add-submit-btn">Enregistrer</button>
      </footer>
    </form>
  </article>
</dialog>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof initializeAddShadowModal === 'function') {
      initializeAddShadowModal();
    }
  });
</script>
